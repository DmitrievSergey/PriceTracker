version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: price_tracker_db
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
  kafka:
    image: apache/kafka:3.8.0
    container_name: price_tracker_kafka
    ports:
      - "9092:9092"
    environment:
      # Включаем режим KRaft (без Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      # Настройки слушателей (внутри сети докера и снаружи для Java приложений)
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      # Локальные настройки очередей для тестов
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_LOG_DIRS: '/var/lib/kafka/data/controller'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data/broker'